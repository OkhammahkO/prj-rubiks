    on_press:
      - script.execute: beep_click
      - script.execute:
          id: flash_led
          idx: 1
      - homeassistant.action:
          action: button.press
          data:
            entity_id: button.rubiks_cube_scanner_robot_abort
  - platform: tm1638
    name: "TM1638 Button 3" # Confirm Safe & Home
    id: tm1638_button_3
    entity_category: diagnostic
    icon: mdi:home-import-outline
