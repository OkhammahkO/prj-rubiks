    restore_value: true
    mode: box
    initial_value: 77
    min_value: 30
    max_value: 150
    step: 1
    on_value:
      - lambda: |-
          id(solver).set_t_servo_close((int)x);
          id(solver).recompute_positions();

  #   - platform: template
  #     name: "Top: Release Offset"
  #     entity_category: config
  #     optimistic: true
  #     restore_value: true
  #     mode: box
  #     initial_value: 0
