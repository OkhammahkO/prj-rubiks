# ── Rubiks Solver component ───────────────────────────────────────────────────
# Calibration is done live via HA number entities above — no YAML overrides needed.

rubiks_solver:
  id: solver
  top_servo: top_servo
  bottom_servo: bottom_servo
  status_sensor:
    name: "Status"
    id: solver_status_text
    entity_category: diagnostic
    on_value:
      # "FACE N" — cube in position for face N, ready to scan → short beep + light
      # that face's LED (building a 1-6 progress bar across the scan)
      - if:
          condition:
            lambda: 'return x.find("FACE ") == 0;'
          then:
            - rtttl.play:
                rtttl: "rdy:d=16,o=5,b=120:c6"
            - lambda: |-
                static switch_::Switch *const leds[8] = {
                    id(tm1638_led_1), id(tm1638_led_2), id(tm1638_led_3), id(tm1638_led_4),
                    id(tm1638_led_5), id(tm1638_led_6), id(tm1638_led_7), id(tm1638_led_8)};
                int n = atoi(x.c_str() + 5);  // "FACE " is 5 chars
                if (n >= 1 && n <= 8) leds[n - 1]->turn_on();
      # "HOMING" — 6th face just captured, returning cube to start position →
      # double beep + scan-progress LEDs collapse off in reverse
      - if:
          condition:
            lambda: 'return x == "HOMING";'
          then:
            - rtttl.play:
                rtttl: "homing:d=8,o=4,b=120:g4,p,g4"
            - script.execute: homing_led_collapse
      # "SCAN END" — physically back home, ready to solve → double beep + LED chase
      - if:
          condition:
            lambda: 'return x == "SCAN END";'
          then:
            - rtttl.play:
                rtttl: "scan_done:d=8,o=5,b=120:c6,p,c6,p,c6"
            - script.execute: scan_end_chase
      # "SOLVING" — continuous LED sweep for the duration of the solve
      - if:
          condition:
            lambda: 'return x == "SOLVING";'
          then:
            - script.execute: solving_led_sweep
      # "DONE" — solve complete → short ascending melody + LED celebration
      - if:
          condition:
            lambda: 'return x == "DONE";'
          then:
            - rtttl.play:
                rtttl: "victory:d=16,o=5,b=120:c,e,g,c6"
            - script.execute: done_celebration
      # "CHK ARM" — needs human confirmation after an unclean reset → slow blink
      - if:
          condition:
            lambda: 'return x == "CHK ARM";'
          then:
            - script.execute: chk_arm_led_blink
      # "IDLE" — safety net so no progress/status LED is ever left stuck on
      - if:
          condition:
            lambda: 'return x == "IDLE";'
          then:
            - script.execute: idle_led_reset
  # Optimistic — tracks the commanded move sequence, not real position feedback (there
  # is none). True only right after a sequence completes at cover-open + bottom-home;
  # false the instant any step is queued. See docs/servo-tuning.md.
  believed_home_sensor:
    name: "Believed Home"
    id: believed_home
    entity_category: diagnostic
    icon: mdi:home-map-marker
  # Counts down from the full robot-action count to 0 as execute_solution() progresses.
  # Only meaningful while status is "SOLVING" — see the display lambda above.
  moves_remaining_sensor:
    name: "Moves Remaining"
    id: moves_remaining
    entity_category: diagnostic
    icon: mdi:counter
