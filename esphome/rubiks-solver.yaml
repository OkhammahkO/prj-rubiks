    icon: mdi:gesture-tap-button
    key: 5
    filters:
      - delayed_on: 10ms
    on_press:
      - script.execute: beep_click
      - script.execute:
          id: flash_led
          idx: 5
  - platform: tm1638
    name: "TM1638 Button 7"
    id: tm1638_button_7
    entity_category: diagnostic
    icon: mdi:gesture-tap-button
    key: 6
    filters:
      - delayed_on: 10ms
    on_press:
      - script.execute: beep_click
      - script.execute:
