          idx: 7

# ── Servos ───────────────────────────────────────────────────────────────────
# Extended pulse range: 0.5–2.5 ms at 50 Hz → min_level 2.5%, max_level 12.5%.
# CUBOTino recommends this when servos only just reach 180° on the standard 1–2ms range.
# duty_to_esphome() in rubiks_solver.cpp uses matching formula: (pct - 7.5) / 5.0
# Duty values in Cubotino_settings.txt are raw MicroPython 0–1023 scale.
# ESPHome maps min_level → -1.0, idle_level → 0.0, max_level → +1.0.

servo:
  - id: top_servo
    output: top_servo_output
    min_level: 2.5% # 0.5 ms
    idle_level: 7.5% # 1.5 ms
    max_level: 12.5% # 2.5 ms
    auto_detach_time: 5s # must exceed longest step duration (b_rotate_time 1200ms) to avoid mid-travel dropout
  - id: bottom_servo
    output: bottom_servo_output
    min_level: 2.5% # 0.5 ms
    idle_level: 7.5% # 1.5 ms
    max_level: 12.5% # 2.5 ms
    auto_detach_time: 5s # same — servos relax naturally after solve completes

# ── Servo test buttons ───────────────────────────────────────────────────────
# Assembly and calibration aids. Only work when solver state is IDLE.

button:
  # ── Robot control ─────────────────────────────────────────────────────────────
  - platform: template
    name: "Robot: Start Scan"
    icon: "mdi:cube-scan"
    on_press:
      lambda: "id(solver).start_scan();"

  - platform: template
    name: "Robot: Stop"
    icon: "mdi:stop-circle-outline"
    on_press:
      lambda: "id(solver).stop();"

  - platform: template
    name: "Robot: Next Face"
    icon: "mdi:arrow-right-circle-outline"
    entity_category: diagnostic
    on_press:
      lambda: "id(solver).advance_scan();"

  # Only needed after an unclean reset (crash/watchdog/brownout) — setup() skips the
  # automatic boot glide in that case and shows "CHK ARM" on the display. Physically
  # check the arm/turntable aren't in a colliding position before pressing this.
  - platform: template
    name: "Robot: Confirm Safe & Home"
    icon: "mdi:home-import-outline"
    entity_category: diagnostic
    on_press:
      lambda: "id(solver).confirm_safe_and_home();"

  # Bare hardware check for the TM1638 — writes directly to the status text sensor the
  # display already mirrors, independent of the solver's own state machine. No servo
  # motion, no beep (the RTTTL on_value conditions don't match "HELLO"). If this doesn't
  # show up, the problem is display wiring (GPIO 14/41/42), not firmware logic.
  - platform: template
    name: "Test: Display Hello"
    icon: "mdi:monitor-eye"
    entity_category: diagnostic
    on_press:
      lambda: 'id(solver_status_text).publish_state("HELLO");'

  # ── Sweep test buttons (replicates servo_to_mid.py) ─────────────────────────
  # Sweeps 2%→14% duty over ~22s then stops at centre (7.5% = 1.5ms).
  # Run one at a time. Observe full range; servo with larger range → cube_holder.
  - platform: template
    name: "Test: Sweep Top"
    entity_category: diagnostic
    icon: mdi:arm-flex-outline
    on_press:
      - script.execute: sweep_top_servo

  - platform: template
    name: "Test: Sweep Bottom"
    entity_category: diagnostic
    icon: mdi:rotate-3d-variant
    on_press:
      - script.execute: sweep_bottom_servo

  # ── Diagnostic execute buttons (paired with selects below) ───────────────────
  - platform: template
    name: "Servo: Go"
    entity_category: diagnostic
    icon: mdi:play-circle-outline
    on_press:
      - lambda: |-
          const auto &s = id(servo_pos_select).current_option();
          if      (s == "Centre Both")  id(solver).servo_centre();
          else if (s == "Top: Flip")    id(solver).servo_top_flip();
          else if (s == "Top: Open")    id(solver).servo_top_open();
          else if (s == "Top: Close")   id(solver).servo_top_close();
          else if (s == "Bottom: CCW")  id(solver).servo_bottom_ccw();
          else if (s == "Bottom: Home") id(solver).servo_bottom_home();
          else if (s == "Bottom: CW")   id(solver).servo_bottom_cw();

  - platform: template
    name: "Test: Run"
    entity_category: diagnostic
    icon: mdi:play-box-outline
    on_press:
      - lambda: |-
          const auto &s = id(test_action_select).current_option();
          if      (s == "Rotate CW+Home")          id(solver).test_rotate_cw_home();
          else if (s == "Rotate CCW+Home")         id(solver).test_rotate_ccw_home();
          else if (s == "Flip x1")                 id(solver).test_flip(1);
          else if (s == "Flip x2")                 id(solver).test_flip(2);
          else if (s == "Spin CW+Home")            id(solver).test_spin_cw_home();
          else if (s == "Spin CCW+Home")           id(solver).test_spin_ccw_home();
          else if (s == "Scan Cycle")              id(solver).test_scan_cycle();
          else if (s == "Return Home (Post-Scan)") id(solver).test_scan_return_home();
          else                                     id(solver).execute_solution(s.c_str());

# ── Servo range test sliders ──────────────────────────────────────────────────
# Bypass servo component (no min/max clamping) — drive LEDC output directly.
# duty% × 20ms = pulse width.  2.5%=0.5ms, 7.5%=1.5ms(centre), 12.5%=2.5ms.
# Drag toward extremes to find physical endpoints.

number:
  - platform: template
    name: "Test: Top Raw"
    entity_category: diagnostic
    icon: mdi:tune-vertical
    unit_of_measurement: "%"
    mode: box
    min_value: 2
    max_value: 14
    step: 0.5
    initial_value: 7.5
    optimistic: true
    on_value:
      - output.set_level:
          id: top_servo_output
          level: !lambda "return x / 100.0;"

  - platform: template
    name: "Test: Bottom Raw"
    entity_category: diagnostic
    icon: mdi:tune-vertical
    unit_of_measurement: "%"
    mode: box
    min_value: 2
    max_value: 14
    step: 0.5
    initial_value: 7.5
    optimistic: true
    on_value:
      - output.set_level:
          id: bottom_servo_output
          level: !lambda "return x / 100.0;"

  # ── Servo calibration — bottom positions ─────────────────────────────────
  # Adjust live in HA — values persist to flash (restore_value: true).
  # Scale: 0–1023 raw duty (Cubotino_settings.txt).  duty/1023*20ms = pulse width.
  # Extended range active: 0.5–2.5ms (2.5%–12.5%). duty_to_esphome formula: (pct-7.5)/5.0
  - platform: template
    name: "Top: Flip Pos"
    entity_category: config
    icon: mdi:crosshairs-gps
    optimistic: true
    restore_value: true
    mode: box
    initial_value: 54
    min_value: 30
    max_value: 150
    step: 1
    on_value:
      - lambda: |-
          id(solver).set_t_servo_flip((int)x);
          id(solver).recompute_positions();

  - platform: template
    name: "Top: Open Pos"
    entity_category: config
    icon: mdi:crosshairs-gps
