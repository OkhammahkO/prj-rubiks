esphome:
  name: rubiks-solver
  project:
    name: "okhammahko.rubiks_solver"
    version: "0.4.5"

esp32:
  framework:
    type: arduino
  board: esp32-s3-devkitc-1 # Pinout: https://emakefun.github.io/emakefun-docsify/zh-cn/esp32/esp32s3-cam/picture/esp32s3_cam_pin.png

# Exposed: GPIO0, GPIO1, GPIO14, GPIO41, GPIO42, GPIO43, GPIO44, GPIO46, GPIO47, GPIO48

# +--------------+--------+----------------------------------+------------+
# | FUNCTION     | GPIO   | NOTES                            | STATUS     |
# +--------------+--------+----------------------------------+------------+
# | TM1638 STB   | GPIO14 | baseline                         | ✅ Working |
# | TM1638 CLK   | GPIO41 | debug pin                        | ✅ Working |
# | TM1638 DIO   | GPIO42 | harness short fixed, resoldered  | ✅ Working |
# | Top Servo    | GPIO1  | -                                | ✅ Working |
# | Bottom Servo | GPIO43 | -                                | ✅ Working |
# | Buzzer       | GPIO44 | -                                | ✅ Working |
# +--------------+--------+----------------------------------+------------+

# ── Spare pins (tested, unused) ──
# +--------+-------------------------------------------+---------------+
# | GPIO   | NOTES                                     | STATUS        |
# +--------+-------------------------------------------+---------------+
# | GPIO47 | tested end-to-end with TM1638, unused now | ✅ Spare      |
# | GPIO46 | strapping pin, spare only                 | ⚠️ Spare only |
# | GPIO48 |                                           | ?              |
# +--------+-------------------------------------------+---------------+

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.1.143
    gateway: 192.168.1.1
    subnet: 255.255.255.0

ota:
  - platform: esphome

logger:
  baud_rate: 0 # disables UART logger output → no more serial noise on GPIO43

debug:

text_sensor:
  - platform: debug # Useful for any brownout debugging
    reset_reason:
      name: "Reset Reason"
      icon: mdi:restart-alert

psram:
  mode: octal

# ── TM1638 display ────────────────────────────────────────────────────────────
# 8-digit 7-segment display. Shows solver_status text sensor state.
display:
  platform: tm1638
  id: tm1638_display
  dio_pin: 42 # Green Wire  | Cable position 2
  clk_pin: 41 # Blue Wire   | Cable position 1
  stb_pin: 14 # Yellow Wire | Cable position 7
  intensity: 1
  update_interval: 500ms

  lambda: |-
    // While solving, show the moves countdown.
    // Otherwise show the plain status text (IDLE, SCAN N, FACE N, HOMING, ...).
    std::string s;
    bool solving = id(solver_status_text).has_state() && id(solver_status_text).state == "SOLVING";
    if (solving && id(moves_remaining).has_state()) {
      char buf[9];
      snprintf(buf, sizeof(buf), "LEFT%3d", (int) id(moves_remaining).state);
      s = buf;
    } else {
      s = id(solver_status_text).has_state() ? id(solver_status_text).state : std::string("IDLE");
    }
    s.resize(8, ' ');  // right-pad — the TM1638 shows all 8 digits regardless
    it.print(s.c_str());

api:
  homeassistant_services: true
  actions:
    - action: start_scan
      then:
        - lambda: "id(solver).start_scan();"

    - action: face_scan_done
      then:
        - lambda: "id(solver).advance_scan();"

    - action: execute_solution # Execute the solved sequence
      supports_response: optional
      variables:
        solution: string
      then:
        - lambda: "id(solver).execute_solution(solution);"
        - api.respond:
            data: !lambda |-
              root["accepted"]   = id(solver).solution_accepted();
              root["move_count"] = id(solver).move_count();

    - action: stop
      then:
        - lambda: "id(solver).stop();"

    - action: confirm_safe_and_home
      then:
        - lambda: "id(solver).confirm_safe_and_home();"

external_components:
  - source:
      type: local
      path: components
    components: [rubiks_solver] # Custom component for Rubik's Cube solver logic.

globals:
  - id: g_sweep_step # Shared counter for sweep_top_servo and sweep_bottom_servo scripts.
    type: int
    restore_value: no
    initial_value: "0"
  - id: g_led_step # Shared counter for LED animation scripts.
    type: int
    restore_value: no
    initial_value: "0"

sensor:
  - platform: uptime
    type: seconds
    name: Uptime
    update_interval: 1s

script:
  # ── Button press feedback ─────────────────────────────────────────────────────
  - id: beep_click
    then:
      - rtttl.play:
          rtttl: "click:d=16,o=5,b=120:d6"

  # ── Flash a single TM1638 LED ───────────────────────────────────────────────
  - id: flash_led
    parameters:
      idx: int
    then:
      - lambda: |-
          static switch_::Switch *const leds[8] = {
              id(tm1638_led_1), id(tm1638_led_2), id(tm1638_led_3), id(tm1638_led_4),
              id(tm1638_led_5), id(tm1638_led_6), id(tm1638_led_7), id(tm1638_led_8)};
          leds[idx]->turn_on();
      - delay: 150ms
      - lambda: |-
          static switch_::Switch *const leds[8] = {
              id(tm1638_led_1), id(tm1638_led_2), id(tm1638_led_3), id(tm1638_led_4),
              id(tm1638_led_5), id(tm1638_led_6), id(tm1638_led_7), id(tm1638_led_8)};
          leds[idx]->turn_off();

  # ── Status LED routines ───────────────────────────────────────────────────────
  - id: homing_led_collapse
    mode: restart
    then:
      - switch.turn_off: tm1638_led_6
      - delay: 100ms
      - switch.turn_off: tm1638_led_5
      - delay: 100ms
      - switch.turn_off: tm1638_led_4
      - delay: 100ms
      - switch.turn_off: tm1638_led_3
      - delay: 100ms
      - switch.turn_off: tm1638_led_2
      - delay: 100ms
      - switch.turn_off: tm1638_led_1

  # SCAN END — one quick marquee chase across all 8, then off. A flourish marking
  # "scan complete, handing off to solve".
  - id: scan_end_chase
    mode: restart
    then:
      - switch.turn_on: tm1638_led_1
      - delay: 60ms
      - switch.turn_off: tm1638_led_1
      - switch.turn_on: tm1638_led_2
      - delay: 60ms
      - switch.turn_off: tm1638_led_2
      - switch.turn_on: tm1638_led_3
      - delay: 60ms
      - switch.turn_off: tm1638_led_3
      - switch.turn_on: tm1638_led_4
      - delay: 60ms
      - switch.turn_off: tm1638_led_4
      - switch.turn_on: tm1638_led_5
      - delay: 60ms
      - switch.turn_off: tm1638_led_5
      - switch.turn_on: tm1638_led_6
      - delay: 60ms
      - switch.turn_off: tm1638_led_6
      - switch.turn_on: tm1638_led_7
      - delay: 60ms
      - switch.turn_off: tm1638_led_7
      - switch.turn_on: tm1638_led_8
      - delay: 60ms
      - switch.turn_off: tm1638_led_8

  # SOLVING — ping-pong chase across all 8, self-terminating when the solver_status_text
  - id: solving_led_sweep
    mode: restart
    then:
      - lambda: "id(g_led_step) = 0;"
      - while:
          condition:
            lambda: 'return id(solver_status_text).state == "SOLVING";'
          then:
            - lambda: |-
                static switch_::Switch *const leds[8] = {
                    id(tm1638_led_1), id(tm1638_led_2), id(tm1638_led_3), id(tm1638_led_4),
                    id(tm1638_led_5), id(tm1638_led_6), id(tm1638_led_7), id(tm1638_led_8)};
                const int period = 14;  // 2*(8-1) — full ping-pong cycle length
                int pos = id(g_led_step) % period;
                int idx = (pos < 8) ? pos : period - pos;
                leds[idx]->turn_on();
            - delay: 80ms
            - lambda: |-
                static switch_::Switch *const leds[8] = {
                    id(tm1638_led_1), id(tm1638_led_2), id(tm1638_led_3), id(tm1638_led_4),
                    id(tm1638_led_5), id(tm1638_led_6), id(tm1638_led_7), id(tm1638_led_8)};
                const int period = 14;
                int pos = id(g_led_step) % period;
                int idx = (pos < 8) ? pos : period - pos;
                leds[idx]->turn_off();
                id(g_led_step)++;
      - lambda: |-
          static switch_::Switch *const leds[8] = {
              id(tm1638_led_1), id(tm1638_led_2), id(tm1638_led_3), id(tm1638_led_4),
              id(tm1638_led_5), id(tm1638_led_6), id(tm1638_led_7), id(tm1638_led_8)};
          for (int i = 0; i < 8; i++) leds[i]->turn_off();

  # DONE — a quick "all 8 on, then off" celebration. A flourish marking "solve complete".
  - id: done_celebration
    mode: restart
    then:
      - switch.turn_on: tm1638_led_1
      - delay: 40ms
      - switch.turn_off: tm1638_led_1
      - switch.turn_on: tm1638_led_2
      - delay: 40ms
      - switch.turn_off: tm1638_led_2
      - switch.turn_on: tm1638_led_3
      - delay: 40ms
      - switch.turn_off: tm1638_led_3
      - switch.turn_on: tm1638_led_4
      - delay: 40ms
      - switch.turn_off: tm1638_led_4
      - switch.turn_on: tm1638_led_5
      - delay: 40ms
      - switch.turn_off: tm1638_led_5
      - switch.turn_on: tm1638_led_6
      - delay: 40ms
      - switch.turn_off: tm1638_led_6
      - switch.turn_on: tm1638_led_7
      - delay: 40ms
      - switch.turn_off: tm1638_led_7
      - switch.turn_on: tm1638_led_8
      - delay: 40ms
      - switch.turn_off: tm1638_led_8
      - switch.turn_on: tm1638_led_8
      - delay: 40ms
      - switch.turn_off: tm1638_led_8
      - switch.turn_on: tm1638_led_7
      - delay: 40ms
      - switch.turn_off: tm1638_led_7
      - switch.turn_on: tm1638_led_6
      - delay: 40ms
      - switch.turn_off: tm1638_led_6
      - switch.turn_on: tm1638_led_5
      - delay: 40ms
      - switch.turn_off: tm1638_led_5
      - switch.turn_on: tm1638_led_4
      - delay: 40ms
      - switch.turn_off: tm1638_led_4
      - switch.turn_on: tm1638_led_3
      - delay: 40ms
      - switch.turn_off: tm1638_led_3
      - switch.turn_on: tm1638_led_2
      - delay: 40ms
      - switch.turn_off: tm1638_led_2
      - switch.turn_on: tm1638_led_1
      - delay: 40ms
      - switch.turn_off: tm1638_led_1
      - switch.turn_on: tm1638_led_1
      - switch.turn_on: tm1638_led_2
      - switch.turn_on: tm1638_led_3
      - switch.turn_on: tm1638_led_4
      - switch.turn_on: tm1638_led_5
      - switch.turn_on: tm1638_led_6
      - switch.turn_on: tm1638_led_7
      - switch.turn_on: tm1638_led_8
      - delay: 300ms
      - switch.turn_off: tm1638_led_1
      - switch.turn_off: tm1638_led_2
      - switch.turn_off: tm1638_led_3
      - switch.turn_off: tm1638_led_4
      - switch.turn_off: tm1638_led_5
      - switch.turn_off: tm1638_led_6
      - switch.turn_off: tm1638_led_7
      - switch.turn_off: tm1638_led_8

  # CHK ARM — a slow alternating blink of odd/even LEDs, self-terminating when the solver_status_text
  #
  - id: chk_arm_led_blink
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(solver_status_text).state == "CHK ARM";'
          then:
            - switch.turn_on: tm1638_led_1
            - switch.turn_on: tm1638_led_3
            - switch.turn_on: tm1638_led_5
            - switch.turn_on: tm1638_led_7
            - switch.turn_off: tm1638_led_2
            - switch.turn_off: tm1638_led_4
            - switch.turn_off: tm1638_led_6
            - switch.turn_off: tm1638_led_8
            - delay: 400ms
            - switch.turn_off: tm1638_led_1
            - switch.turn_off: tm1638_led_3
            - switch.turn_off: tm1638_led_5
            - switch.turn_off: tm1638_led_7
            - switch.turn_on: tm1638_led_2
            - switch.turn_on: tm1638_led_4
            - switch.turn_on: tm1638_led_6
            - switch.turn_on: tm1638_led_8
            - delay: 400ms
      - switch.turn_off: tm1638_led_1
      - switch.turn_off: tm1638_led_2
      - switch.turn_off: tm1638_led_3
      - switch.turn_off: tm1638_led_4
      - switch.turn_off: tm1638_led_5
      - switch.turn_off: tm1638_led_6
      - switch.turn_off: tm1638_led_7
      - switch.turn_off: tm1638_led_8

    # Reset all LEDs to off. Called from setup() after an unclean reset (crash/watchdog/brownout) to clear any stale LED state.
  - id: idle_led_reset
    mode: restart
    then:
      - switch.turn_off: tm1638_led_1
      - switch.turn_off: tm1638_led_2
      - switch.turn_off: tm1638_led_3
      - switch.turn_off: tm1638_led_4
      - switch.turn_off: tm1638_led_5
      - switch.turn_off: tm1638_led_6
      - switch.turn_off: tm1638_led_7
      - switch.turn_off: tm1638_led_8

  # Replicates servo_to_mid.py: sweeps 2%→14% in 25 steps (~22s), stops at centre (7.5%).
  # Run one servo at a time. Observe full rotation range, note which is larger.
  - id: sweep_top_servo
    mode: restart
    then:
      - globals.set:
          id: g_sweep_step
          value: "0"
      - repeat:
          count: 25
          then:
            - lambda: |-
                id(top_servo_output).set_level(0.02f + id(g_sweep_step) * 0.005f);
                id(g_sweep_step)++;
            - delay: 880ms
      - lambda: "id(top_servo_output).set_level(0.075f);" # stop at centre

  - id: sweep_bottom_servo
    mode: restart
    then:
      - globals.set:
          id: g_sweep_step
          value: "0"
      - repeat:
          count: 25
          then:
            - lambda: |-
                id(bottom_servo_output).set_level(0.02f + id(g_sweep_step) * 0.005f);
                id(g_sweep_step)++;
            - delay: 880ms
      - lambda: "id(bottom_servo_output).set_level(0.075f);" # stop at centre

# ── Camera ───────────────────────────────────────────────────────────────────
i2c:
  id: camera_i2c
  sda: GPIO4
  scl: GPIO5

esp32_camera:
  name: Camera
  external_clock:
    pin: GPIO15
    frequency: 20MHz
  i2c_id: camera_i2c
  data_pins: [GPIO11, GPIO9, GPIO8, GPIO10, GPIO12, GPIO18, GPIO17, GPIO16]
  vsync_pin: GPIO6
  href_pin: GPIO7
  pixel_clock_pin: GPIO13
  resolution: 320x240
  jpeg_quality: 10
  idle_framerate: 0.1 fps
  max_framerate: 1 fps
  vertical_flip: true
  horizontal_mirror:
    false
    # --- image tuning ---
  brightness: 0
  contrast: 0
  saturation: 0

  # --- lock exposure ---
  aec_mode: manual
  aec_value: 1200 # adjust up/down until brightest square hits ~0.8 raw V

  # --- lock gain ---
  agc_mode: manual
  agc_value: 16 # fixed LED = no gain needed, minimises noise

  # --- fix white balance (not disable) ---
  wb_mode: sunny # or sunny if your LED is cool/daylight white

# ── LED ──────────────────────────────────────────────────────────────────────

output:
  - platform: ledc
    pin: GPIO03
    channel: 0 # ESP32-S3 has 8 channels (0-7). Each channel can be assigned to a different pin.
    id: led_output
  - platform: ledc
    pin: 1
    channel: 2
    frequency: 50Hz
    id: top_servo_output
  - platform: ledc
    pin: 43
    channel: 4
    frequency: 50Hz
    id: bottom_servo_output
  - platform: ledc
    pin: GPIO44
    channel: 6
    id: buzzer_output

light:
  - platform: monochromatic
    output: led_output
    name: Flash LED

rtttl:
  output: buzzer_output

# ── TM1638 LEDs ──────────────────────────────────────────────────────────────
# 8 individual LEDs, zero-indexed (led: 0-7). Plain switches for now — not yet wired
# to anything (see docs/tm1638.md "8-LED bar progress indication", pipelined).

switch:
  - platform: tm1638
    name: "TM1638 LED 1"
    id: tm1638_led_1
    entity_category: diagnostic
    icon: mdi:led-outline
    led: 0
  - platform: tm1638
    name: "TM1638 LED 2"
    id: tm1638_led_2
    entity_category: diagnostic
    icon: mdi:led-outline
    led: 1
  - platform: tm1638
    name: "TM1638 LED 3"
    id: tm1638_led_3
    entity_category: diagnostic
    icon: mdi:led-outline
    led: 2
  - platform: tm1638
    name: "TM1638 LED 4"
    id: tm1638_led_4
    entity_category: diagnostic
    icon: mdi:led-outline
    led: 3
  - platform: tm1638
    name: "TM1638 LED 5"
    id: tm1638_led_5
    entity_category: diagnostic
    icon: mdi:led-outline
    led: 4
  - platform: tm1638
    name: "TM1638 LED 6"
    id: tm1638_led_6
    entity_category: diagnostic
    icon: mdi:led-outline
    led: 5
  - platform: tm1638
    name: "TM1638 LED 7"
    id: tm1638_led_7
    entity_category: diagnostic
    icon: mdi:led-outline
    led: 6
  - platform: tm1638
    name: "TM1638 LED 8"
    id: tm1638_led_8
    entity_category: diagnostic
    icon: mdi:led-outline
    led: 7

